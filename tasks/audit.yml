---
- name: audit | Gather cloud state
  ansible.builtin.include_tasks: facts.yml

# Each task below adds one finding to the list when its check fails.
- name: audit | Start with no findings
  ansible.builtin.set_fact:
    linux_hardening_cloud_findings: []

- name: audit | Report cloud-init settings that deviate
  ansible.builtin.set_fact:
    linux_hardening_cloud_findings: "{{ linux_hardening_cloud_findings + [finding] }}"
  vars:
    finding:
      key: "cloud-init {{ item.key }}"
      expected: "{{ item.expected }} (or unset)"
      actual: "{{ item.actual }}"
      fixable: true
  loop: "{{ __lh_cloud_ci_bad }}"
  loop_control:
    label: "{{ item.key }}"

- name: audit | Report stored user-data readable by group or others
  ansible.builtin.set_fact:
    linux_hardening_cloud_findings: "{{ linux_hardening_cloud_findings + [finding] }}"
  vars:
    finding:
      key: cloud-init stored user-data
      expected: not readable by group or others (it often holds secrets)
      actual: "{{ __lh_cloud_ud_bad | join(', ') }}"
      fixable: true
  when: __lh_cloud_ud_bad | length > 0

- name: audit | Report AWS instance metadata answering without a token (IMDSv1)
  ansible.builtin.set_fact:
    linux_hardening_cloud_findings: "{{ linux_hardening_cloud_findings + [finding] }}"
  vars:
    finding:
      key: AWS IMDSv2 required
      expected: a request without a token is refused (HTTP 401)
      actual: "answered without a token (IMDSv1 enabled; reported only: aws ec2 modify-instance-metadata-options --http-tokens required)"
      fixable: false
  when:
    - __lh_cloud_provider == 'aws'
    - __lh_cloud_imds.status | default(-1) == 200

- name: audit | Say what was not checked
  ansible.builtin.debug:
    msg: >-
      cloud_hardening found no cloud-init ({{ __linux_hardening_cloud_cfg }}) and no AWS metadata
      (provider: {{ __lh_cloud_provider }}): nothing to check.
  when: not __lh_cloud_ci and __lh_cloud_provider != 'aws'

- name: audit | Report cloud_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_cloud_findings | length == 0 else linux_hardening_cloud_findings }}"

# After remediation only fixable findings fail the run.
- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "cloud_hardening found {{ linux_hardening_cloud_findings | length }} deviation(s)."
  when:
    - not __lh_cloud_audit_fatal | default(false)
    - linux_hardening_fail_on_error | bool
    - linux_hardening_cloud_findings | length > 0

- name: audit | Fail on fixable findings left after remediation
  ansible.builtin.fail:
    msg: "cloud_hardening left {{ linux_hardening_cloud_findings | selectattr('fixable') | list | length }} fixable deviation(s)."
  when:
    - __lh_cloud_audit_fatal | default(false)
    - linux_hardening_cloud_findings | selectattr('fixable') | list | length > 0
