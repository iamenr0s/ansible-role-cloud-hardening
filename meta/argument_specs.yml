---
argument_specs:
  main:
    short_description: Audit cloud-init SSH settings and AWS IMDSv2 enforcement; fix only cloud-init and user-data permissions.
    options:
      linux_hardening_mode: {type: str, default: audit, choices: [audit, remediate], description: "audit is read-only."}
      linux_hardening_confirm_remediation: {type: bool, default: false, description: "Must be true before remediate changes anything."}
      linux_hardening_backup: {type: bool, default: true, description: "Back up the cloud-init drop-in when it changes."}
      linux_hardening_verify: {type: bool, default: true, description: "Re-audit after remediation."}
      linux_hardening_fail_on_error: {type: bool, default: true, description: "Fail the play when audit finds deviations."}
      linux_hardening_cloud_enabled: {type: bool, default: true, description: "Run the role."}
      linux_hardening_cloud_provider: {type: str, default: auto, choices: [auto, aws, none], description: "Which metadata service to check; auto recognises AWS."}
      linux_hardening_cloud_imds_url: {type: str, default: "http://169.254.169.254", description: "Instance metadata endpoint."}
